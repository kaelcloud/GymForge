<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GymForge">
<title>GymForge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0}
:root,:root[data-theme="dark"]{
  --bg:#000000;--bg2:#101214;--surface:#181B1F;--surface2:#22262B;--line:#2D3238;
  --text:#F2F4F6;--muted:#9098A1;--faint:#5F6770;
  --green:#3BD67F;--green-ink:#03160A;--green-soft:rgba(59,214,127,.15);
  --red:#FF6B6B;--red-soft:rgba(255,107,107,.15);--amber:#F2B84B;--amber-soft:rgba(242,184,75,.15);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F2F3F5;--bg2:#E8EAED;--surface:#FFFFFF;--surface2:#ECEEF1;--line:#D5D9DE;
  --text:#0E1114;--muted:#5A626B;--faint:#8A929B;
  --green:#14A653;--green-ink:#FFFFFF;--green-soft:rgba(20,166,83,.13);
  --red:#D63A3A;--red-soft:rgba(214,58,58,.12);--amber:#B97A06;--amber-soft:rgba(185,122,6,.13);
  color-scheme:light;
}
:root{
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav-h:64px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg);-webkit-text-size-adjust:100%;min-height:calc(100% + env(safe-area-inset-top,0px))}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;min-height:100vh;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
svg{flex:none}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(var(--nav-h) + 28px)}
.app.timer-on{padding-bottom:calc(var(--nav-h) + 120px)}
.app.in-workout{padding-bottom:40px}
.app.in-workout.timer-on{padding-bottom:130px}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 0 14px}
.brand{font-family:var(--display);font-weight:800;font-size:32px;line-height:1;letter-spacing:.2px}
h1{font-family:var(--display);font-weight:800;font-size:36px;line-height:1}
.sub{color:var(--muted);font-size:14px;margin-top:5px}
.st{font-family:var(--display);font-size:23px;font-weight:700;margin:28px 0 10px;line-height:1.1}
.st-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 10px}
.st-row .st{margin:0}
.link{background:none;border:none;color:var(--green);font-weight:600;font-size:15px;padding:6px 0}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:600 17px/1.1 var(--body);width:100%;text-align:center;transition:transform .08s}
.btn:active{transform:scale(.985)}
.btn svg{width:20px;height:20px}
.btn.primary{background:var(--green);color:var(--green-ink);border-color:transparent;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.2px}
.btn.big{min-height:66px;font-size:27px;border-radius:16px}
.btn.sm{min-height:40px;width:auto;padding:0 14px;font-size:15px;border-radius:11px}
.btn.primary.sm{font-size:18px}
.btn.danger{color:var(--red)}
.btn.danger.solid{background:var(--red);color:#fff;border-color:transparent}
.btn.quiet{background:transparent}
.btn[disabled]{opacity:.45}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:transparent;border:none;color:var(--text);flex:none}
.icon-btn svg{width:22px;height:22px}
.icon-btn.sm{width:38px;height:38px}
.icon-btn.sm svg{width:19px;height:19px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stack{display:grid;gap:10px}
/* hero */
.hero{background:var(--surface);border-radius:24px;padding:20px 18px 18px;margin:6px 0 18px}
.hero .kicker{color:var(--muted);font-size:15px}
.hero h2{font-family:var(--display);font-size:56px;font-weight:800;line-height:.92;margin:8px 0 10px;letter-spacing:-.6px;overflow-wrap:anywhere}
.hero .ex-line{color:var(--muted);font-size:15px;margin-bottom:18px}
.hero.live{background:var(--green);color:var(--green-ink)}
.hero.live .kicker,.hero.live .ex-line{color:var(--green-ink);opacity:.8}
.hero.live .btn{background:var(--green-ink);color:var(--green);border-color:transparent}
/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg2);border-radius:18px;padding:14px 14px 13px;min-width:0}
.stat .lab{font-size:14px;color:var(--muted)}
.stat .val{font-family:var(--display);font-size:38px;font-weight:700;line-height:1.05;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .val small{font-size:19px;font-weight:600;color:var(--muted);margin-left:2px}
.stat .delta{font-size:13px;color:var(--muted);margin-top:2px}
.delta.good{color:var(--green)}.delta.bad{color:var(--red)}
.bar{height:6px;border-radius:3px;background:var(--surface2);margin-top:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:3px}
/* list rows */
.list{display:grid}
.row{display:flex;align-items:center;gap:12px;padding:14px 2px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;color:inherit}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;font-size:17px;line-height:1.25}
.row .s{font-size:14px;color:var(--muted);margin-top:2px}
.row .r{text-align:right;flex:none}
.row .big{font-family:var(--display);font-size:22px;font-weight:700}
.card{background:var(--surface);border-radius:18px;padding:4px 14px}
.card.pad{padding:16px}
.empty{color:var(--muted);font-size:15px;padding:16px 2px}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.chip svg{width:14px;height:14px}
.chip.up{background:var(--green-soft);color:var(--green)}
.chip.same{background:var(--surface2);color:var(--muted)}
.chip.down{background:var(--red-soft);color:var(--red)}
.chip.new{background:var(--amber-soft);color:var(--amber)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{height:38px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);font:600 15px var(--body);white-space:nowrap;flex:none}
.fchip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface);border-radius:14px;padding:4px;gap:4px;margin:4px 0 18px}
.seg button{height:42px;border:0;border-radius:10px;background:transparent;color:var(--muted);font:600 15px var(--body)}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--text)}
/* programs */
.prog{background:var(--surface);border-radius:20px;padding:16px;margin-bottom:12px}
.prog-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.prog h2{font-family:var(--display);font-size:32px;font-weight:800;line-height:1}
.prog p{font-size:14.5px;color:var(--muted);margin:8px 0 14px}
/* workout */
.wbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);display:flex;align-items:center;gap:6px;margin:0 -16px;padding:10px 16px 10px 6px;border-bottom:1px solid var(--line)}
.wbar-mid{flex:1;min-width:0}
.wbar-title{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wbar-time{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.exc{background:var(--surface);border-radius:22px;padding:16px 14px 14px;margin:14px 0}
.exc-head{display:flex;align-items:flex-start;gap:8px}
.exc-head .grow{flex:1;min-width:0}
.exc h3{font-family:var(--display);font-size:28px;font-weight:700;line-height:1.02;overflow-wrap:anywhere}
.exc .meta{font-size:14px;color:var(--muted);margin-top:4px}
.prevbox{background:var(--bg2);border-radius:14px;padding:10px 12px;font-size:14.5px;color:var(--muted);margin:12px 0 0}
.prevbox b{color:var(--text);font-weight:600}
.rec{border-left:3px solid var(--line);padding:4px 0 4px 12px;font-size:15px;margin:12px 0 14px;display:grid;gap:10px;justify-items:start}
.rec-increase{border-color:var(--green)}
.rec-deload{border-color:var(--amber)}
.rec-new{border-color:var(--amber)}
.sets{display:grid;gap:8px}
.set{display:grid;grid-template-columns:26px 58px 1fr 1fr 52px;gap:8px;align-items:center}
.set.head{font-size:12.5px;color:var(--faint);text-align:center}
.set-n{font-family:var(--display);font-size:21px;font-weight:600;color:var(--muted);text-align:center}
.set-n.up{color:var(--green)}.set-n.down{color:var(--red)}
.set-prev{font-family:var(--display);font-size:16px;font-weight:500;color:var(--faint);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.num{width:100%;min-width:0;height:54px;border-radius:13px;border:1.5px solid transparent;background:var(--surface2);color:var(--text);font:600 27px/1 var(--display);text-align:center;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;padding:0 4px}
.num::placeholder{color:var(--faint);opacity:1}
.num:focus{outline:none;border-color:var(--green)}
.check{width:52px;height:54px;border-radius:14px;border:2px solid var(--line);background:transparent;color:var(--faint);display:grid;place-items:center}
.check svg{width:24px;height:24px;stroke-width:2.6}
.set.done .check{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.set.done .num{background:var(--green-soft)}
.exc-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.exc-actions .btn{flex:1;min-width:0;width:auto;min-height:44px;font-size:15px;padding:0 10px}
.note{width:100%;margin-top:10px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--text);font:400 15px/1.4 var(--body);padding:11px 12px;resize:vertical}
/* timer */
.timer{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));z-index:19;padding:0 10px 10px;display:none}
.timer.show{display:block}
.in-workout-body .timer{bottom:0;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.timer-in{max-width:540px;margin:0 auto;background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:4px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.timer-bar{position:absolute;left:0;bottom:0;height:4px;background:var(--green);transition:width .25s linear}
.timer-main{flex:1;min-width:0}
.timer-time{font-family:var(--display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.timer-lab{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer .icon-btn{width:46px;height:46px;background:var(--surface);border-radius:13px}
.timer .adj{font:600 15px var(--body)}
.timer.finished .timer-in{background:var(--green);color:var(--green-ink);border-color:transparent}
.timer.finished .timer-lab{color:var(--green-ink)}
.timer.finished .icon-btn{background:rgba(0,0,0,.15);color:var(--green-ink)}
/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.nav button{background:none;border:none;color:var(--faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 12px var(--body)}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--green)}
.in-workout-body .nav{display:none}
/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:50;display:none}
.sheet-wrap.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.62)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:calc(100% - env(safe-area-inset-top,0px) - 16px);overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg2);border-radius:24px 24px 0 0;padding:8px 16px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h2{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.02;margin-bottom:6px;overflow-wrap:anywhere}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px}
.sheet p.lead{color:var(--muted);font-size:15px;margin-bottom:16px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>span{font-size:14px;color:var(--muted)}
.input,.sheet select,.sheet textarea,.select{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:500 17px var(--body);padding:0 14px;-webkit-appearance:none;appearance:none}
.select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 22px,calc(100% - 15px) 22px;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
.sheet textarea{padding:12px 14px;min-height:90px;resize:vertical;line-height:1.4}
.input:focus,.select:focus,.sheet textarea:focus{outline:none;border-color:var(--green)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:6px 0 16px}
.kv dt{color:var(--muted)}
.pick{display:flex;align-items:center;gap:12px;width:100%;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left}
.pick .box{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;flex:none}
.pick .box svg{width:16px;height:16px;stroke-width:3}
.pick[aria-pressed="true"] .box{background:var(--green);border-color:var(--green);color:var(--green-ink)}
.order{display:flex;align-items:center;gap:4px;padding:8px 0;border-bottom:1px solid var(--line)}
.order .grow{flex:1;min-width:0;font-weight:600;padding-left:2px}
.order .grow .s{font-weight:400;font-size:13.5px;color:var(--muted)}
.search{position:relative;margin-bottom:10px}
.search svg{position:absolute;left:14px;top:15px;width:20px;height:20px;color:var(--faint)}
.search .input{padding-left:44px}
.sticky-foot{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));background:var(--bg2);padding:12px 0 calc(22px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-22px - env(safe-area-inset-bottom,0px))}
/* charts */
.chart{margin:6px 0 2px}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--faint);font:500 10.5px var(--body)}
.chart .vlab{fill:var(--text);font-weight:600}
.chart-empty{color:var(--muted);font-size:14.5px;padding:26px 8px;text-align:center;background:var(--bg2);border-radius:14px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.panel{background:var(--surface);border-radius:18px;padding:14px 12px 12px;margin-bottom:14px}
.panel h3{font-family:var(--display);font-size:21px;font-weight:700;margin:0 4px 2px}
.panel .s{font-size:13.5px;color:var(--muted);margin:0 4px 6px}
.bigstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.bigstats div{background:var(--bg2);border-radius:14px;padding:10px 12px}
.bigstats b{display:block;font-family:var(--display);font-size:27px;font-weight:700;line-height:1.1}
.bigstats span{font-size:13px;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl td{padding:10px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td:last-child{text-align:right}
.notice{background:var(--amber-soft);color:var(--text);border-radius:14px;padding:12px 14px;font-size:14.5px;margin:10px 0}
.backup-line{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;padding:4px 14px;border-radius:14px;background:var(--bg2);font-size:14.5px;color:var(--muted)}
.backup-line.due{background:var(--amber-soft);color:var(--text)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translate(-50%,-140%);z-index:60;background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;max-width:calc(100% - 32px);transition:transform .25s ease;box-shadow:0 8px 24px rgba(0,0,0,.35);text-align:center}
.toast.show{transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:360px){.hero h2{font-size:46px}.stat .val{font-size:32px}.set{grid-template-columns:22px 50px 1fr 1fr 48px;gap:6px}.num{font-size:24px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app" class="app" aria-live="polite"></main>
<div id="timer" class="timer" role="timer" aria-label="Rest timer"></div>
<nav class="nav" aria-label="Main"><div class="nav-in" id="nav"></div></nav>
<div id="sheet" class="sheet-wrap" aria-hidden="true"><div class="backdrop" data-act="sheet-close"></div><div class="sheet" role="dialog" aria-modal="true" id="sheet-body"></div></div>
<div id="toast" class="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" class="sr" tabindex="-1" aria-hidden="true">
<script>
(function(){
'use strict';

/* ---------- constants ---------- */
const KEY='gymforge.data';
const SCHEMA=1;
const DAY=864e5;
const MUSCLES=['Chest','Back','Shoulders','Biceps','Triceps','Legs','Abs','Cardio'];
const EQUIP=['Machine','Cable','Dumbbell','Barbell','Smith machine','Kettlebell','Bodyweight','Band','Cardio machine','Other'];
const DEFAULT_INC={'Machine':5,'Cable':2.5,'Dumbbell':2.5,'Barbell':2.5,'Smith machine':2.5,'Kettlebell':4,'Bodyweight':0,'Band':0,'Cardio machine':0,'Other':2.5};
const BODY_FIELDS=[['weight','Body weight','kg'],['bf','Body fat','%'],['waist','Waist','cm'],['chest','Chest','cm'],['arm','Arm','cm'],['thigh','Thigh','cm']];

const SEED=[
['machine-chest-press','Machine Chest Press','Chest','Machine',3,8,12,90,'Set the seat so the handles line up with mid-chest. Press forward without locking your elbows, then let the handles come back slowly until you feel a stretch across the chest.'],

let storageOK=true;
function defaults(){
  return {
    schema:SCHEMA, createdAt:Date.now(),
    settings:{weeklyGoal:4, defaultRest:90, theme:'dark', backupDays:7, lastBackup:null, inc:Object.assign({},DEFAULT_INC)},
    exercises:SEED.map(a=>({id:'s_'+a[0],name:a[1],muscle:a[2],equipment:a[3],sets:a[4],repMin:a[5],repMax:a[6],rest:a[7],instructions:a[8],step:null,custom:false,archived:false})),
    programs:SEED_PROGRAMS.map(p=>({id:p[0],name:p[1],items:p[2].map(x=>'s_'+x)})),
    workouts:[], active:null, body:[], cardio:[]
  };
}
function migrate(d){
  const base=defaults();
  if(!d||typeof d!=='object')return base;
  d.schema=d.schema||1;
  d.settings=Object.assign({},base.settings,d.settings||{});
  d.settings.inc=Object.assign({},DEFAULT_INC,d.settings.inc||{});
  ['exercises','programs','workouts','body','cardio'].forEach(k=>{if(!Array.isArray(d[k]))d[k]=k==='exercises'||k==='programs'?base[k]:[];});
  d.exercises.forEach(e=>{if(e.archived==null)e.archived=false;if(e.step===undefined)e.step=null;if(!e.muscle)e.muscle='Chest';if(!e.equipment)e.equipment='Other';});
  d.programs.forEach(p=>{if(!Array.isArray(p.items))p.items=[];});
  d.workouts.forEach(w=>{if(!Array.isArray(w.exercises))w.exercises=[];w.exercises.forEach(e=>{if(!Array.isArray(e.sets))e.sets=[];});});
  d.workouts.sort((a,b)=>b.start-a.start);
  if(d.active&&!Array.isArray(d.active.exercises))d.active=null;
  return d;
}
function load(){
  let raw=null;
  try{raw=localStorage.getItem(KEY);}catch(e){storageOK=false;}
  if(!raw)return defaults();
  try{
    const d=migrate(JSON.parse(raw));
    try{ // keep a daily safety copy of the last good data
      const snap=JSON.parse(localStorage.getItem(KEY+'.snapshot.meta')||'{}');
      if(!snap.at||Date.now()-snap.at>DAY){localStorage.setItem(KEY+'.snapshot',raw);localStorage.setItem(KEY+'.snapshot.meta',JSON.stringify({at:Date.now()}));}
    }catch(e){}
    return d;
  }catch(e){
    try{const s=localStorage.getItem(KEY+'.snapshot');if(s){setTimeout(()=>toast('Main data was unreadable, restored the latest safety copy'),600);return migrate(JSON.parse(s));}}catch(e2){}
    try{localStorage.setItem(KEY+'.corrupt.'+Date.now(),raw);}catch(e3){}
    return defaults();
  }
}

const ex=id=>S.exercises.find(e=>e.id===id);
const isCardio=e=>e&&e.muscle==='Cardio';
const stepFor=e=>e&&e.step!=null&&e.step!==''?+e.step:(S.settings.inc[e&&e.equipment]!=null?+S.settings.inc[e.equipment]:2.5);
const exName=(id,fallback)=>{const e=ex(id);return e?e.name:(fallback||'Removed exercise');};
const vol=ss=>ss.reduce((a,s)=>a+(+s.w||0)*(+s.r||0),0);
const topW=ss=>ss.reduce((a,s)=>Math.max(a,+s.w||0),0);
const totReps=ss=>ss.reduce((a,s)=>a+(+s.r||0),0);
const repsAt=(ss,w)=>ss.filter(s=>Math.abs((+s.w||0)-w)<1e-6).reduce((a,s)=>a+(+s.r||0),0);
const e1rm=ss=>ss.reduce((a,s)=>{const w=+s.w||0,r=+s.r||0;return w>0&&r>0?Math.max(a,r===1?w:w*(1+r/30)):a;},0);
const eq=(a,b)=>Math.abs(a-b)<1e-6;

function sessionsFor(exId){
  const out=[];
  for(const w of S.workouts){
    for(const e of w.exercises){ if(e.exId===exId&&e.sets.length){out.push({w:w,e:e,sets:e.sets});break;} }
  }
  return out;
}
// compare two set lists: 'up' | 'same' | 'down'
function compare(cur,prev){
  if(!prev||!prev.length||!cur||!cur.length)return null;
  const tc=topW(cur),tp=topW(prev);
  if(tc>tp+1e-6)return 'up';
  if(tc<tp-1e-6)return vol(cur)>vol(prev)?'same':'down';
  const rc=repsAt(cur,tc),rp=repsAt(prev,tp);
  if(rc>rp)return 'up'; if(rc<rp)return 'down';
  const vc=vol(cur),vp=vol(prev);
  if(vc>vp+1e-6)return 'up'; if(vc<vp-1e-6)return 'down';
  return 'same';
}
function compareSet(s,p){
  if(!p)return null;const w=+s.w||0,pw=+p.w||0,r=+s.r||0,pr=+p.r||0;
  if(w>pw+1e-6)return 'up'; if(w<pw-1e-6)return 'down';
  return r>pr?'up':r<pr?'down':'same';
}
function describeDelta(cur,prev){
  if(!prev||!prev.length)return 'First session';
  const tc=topW(cur),tp=topW(prev);
  if(!eq(tc,tp))return signed(tc-tp,'kg');
  const d=repsAt(cur,tc)-repsAt(prev,tp);
  if(d)return signed(d,d===1||d===-1?'rep':'reps',0);
  const v=vol(cur)-vol(prev);
  if(Math.abs(v)>1e-6)return signed(v,'kg volume',0);
  return 'Same as last time';
}
function setsStr(ss){
  if(!ss.length)return '–';
  const ws=ss.map(s=>+s.w||0);
  if(ws.every(w=>eq(w,ws[0]))){
    return ws[0]>0?fmt(ws[0])+' kg × '+ss.map(s=>s.r).join(', '):ss.map(s=>s.r).join(', ')+' reps';
  }
  return ss.map(s=>fmt(+s.w||0)+'×'+s.r).join(', ');
}
// double progression recommendation
function recommend(e,hist){
  if(!e)return null;
  hist=hist||sessionsFor(e.id);
  const range=e.repMin+'–'+e.repMax;
  if(!hist.length)return {kind:'new',text:'First time logging this. Pick a weight you can lift for '+range+' clean reps on every set.'};
  const last=hist[0].sets, w=topW(last), atTop=last.filter(s=>eq(+s.w||0,w)), step=stepFor(e);
  const counted=atTop.slice(0,e.sets);
  const allMax=counted.length>=e.sets&&counted.every(s=>(+s.r||0)>=e.repMax);
  if(allMax){
    if(step>0)return {kind:'increase',from:w,to:r2(w+step),text:'Last time you hit '+e.repMax+' reps on all '+e.sets+' sets at '+fmt(w)+' kg. If your form was solid, move up to '+fmt(w+step)+' kg. Reps can drop back toward '+e.repMin+'. That is expected.'};
    return {kind:'reps',text:'Top of the range on every set. Add a set, slow the lowering phase, or switch to a harder variation.'};
  }
  const low=atTop.some(s=>(+s.r||0)<e.repMin);
  if(low){
    const p=hist[1];
    const prevLow=p&&eq(topW(p.sets),w)&&p.sets.filter(s=>eq(+s.w||0,w)).some(s=>(+s.r||0)<e.repMin);
    if(prevLow&&step>0&&w-step>0)return {kind:'deload',from:w,to:r2(w-step),text:'Two sessions in a row under '+e.repMin+' reps at '+fmt(w)+' kg. Consider '+fmt(w-step)+' kg and build back up.'};
    return {kind:'hold',text:'Stay at '+(w>0?fmt(w)+' kg':'bodyweight')+' and get at least '+e.repMin+' reps on every set.'};
  }
  const targets=Array.from({length:e.sets},(_,i)=>Math.min(e.repMax,((atTop[i]&&+atTop[i].r)||e.repMin)+1));
  return {kind:'hold',targets:targets,text:'Stay at '+(w>0?fmt(w)+' kg':'bodyweight')+' and beat last time by a rep. Aim for '+targets.join(' / ')+'.'};
}
function nextProgram(){
  if(!S.programs.length)return null;
  const last=S.workouts.find(w=>w.programId&&S.programs.some(p=>p.id===w.programId));
  if(!last)return S.programs[0];
  const i=S.programs.findIndex(p=>p.id===last.programId);
  return S.programs[(i+1)%S.programs.length];
}
function weekCount(ws){return S.workouts.filter(w=>weekStart(w.start)===ws).length;}
function weekStreak(){
  const goal=Math.max(1,S.settings.weeklyGoal|0);let ws=weekStart(Date.now()),n=0;
  if(weekCount(ws)>=goal)n++;
  ws=weekStart(ws-3*DAY);
  for(let k=0;k<520;k++){if(weekCount(ws)>=goal){n++;ws=weekStart(ws-3*DAY);}else break;}
  return n;
}
function sortedBody(){return S.body.slice().sort((a,b)=>b.date-a.date||b.id.localeCompare(a.id));}
function latestMetric(k){
  const list=sortedBody().filter(b=>b[k]!=null&&b[k]!=='');
  if(!list.length)return null;
  return {v:+list[0][k],date:list[0].date,prev:list[1]?+list[1][k]:null,prevDate:list[1]?list[1].date:null};
}
function recentImprovements(n){
  const out=[];
  for(const e of S.exercises){
    if(isCardio(e))continue;
    const h=sessionsFor(e.id);
    if(h.length<2)continue;
    if(compare(h[0].sets,h[1].sets)==='up')out.push({e:e,when:h[0].w.start,d:describeDelta(h[0].sets,h[1].sets),now:setsStr(h[0].sets)});
  }
  return out.sort((a,b)=>b.when-a.when).slice(0,n);
}
function exercisesWithHistory(){
  const seen=new Map();
  for(const w of S.workouts)for(const e of w.exercises){if(e.sets.length&&!seen.has(e.exId))seen.set(e.exId,w.start);}
  return [...seen.keys()];
}
function chip(st,label){
  if(!st)return '';
  const m={up:['up','Improved',I.arrowUp],same:['same','Maintained',I.equal],down:['down','Decreased',I.arrowDown],new:['new','New','']}[st];
  return '<span class="chip '+m[0]+'">'+m[2]+(label||m[1])+'</span>';
}

function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600);}
function openSheet(html,handlers){
  sheetH=handlers||{};
  const w=$('#sheet');$('#sheet-body').innerHTML='<div class="grab"></div>'+html;
  w.classList.add('open');w.setAttribute('aria-hidden','false');$('#sheet-body').scrollTop=0;
  document.body.style.overflow='hidden';
}
function closeSheet(){const w=$('#sheet');w.classList.remove('open');w.setAttribute('aria-hidden','true');sheetH={};document.body.style.overflow='';if(sheetH.onclose)sheetH.onclose();}
function confirmSheet(msg,ok,danger,title){
  return new Promise(res=>{
    let done=false;const fin=v=>{if(done)return;done=true;closeSheet();res(v);};
    openSheet((title?'<h2>'+esc(title)+'</h2>':'')+'<p class="lead" style="color:var(--text);font-size:16.5px">'+esc(msg)+'</p><div class="stack"><button class="btn '+(danger?'danger solid':'primary')+'" data-act="c-ok">'+esc(ok||'OK')+'</button><button class="btn quiet" data-act="c-no">Cancel</button></div>',
      {'c-ok':()=>fin(true),'c-no':()=>fin(false),'sheet-close':()=>fin(false)});
  });
}
const field=(label,inner)=>'<label class="field"><span>'+esc(label)+'</span>'+inner+'</label>';
const opts=(list,sel)=>list.map(v=>'<option'+(v===sel?' selected':'')+'>'+esc(v)+'</option>').join('');

/* ---------- charts ---------- */
const PAL=['var(--green)','#6FB7FF','#F2B84B','#D88CFF'];
function niceStep(range){const r=range/3;const p=Math.pow(10,Math.floor(Math.log10(r||1)));const m=r/p;return (m<1.5?1:m<3?2:m<7?5:10)*p;}
function lineChart(series,o){
  o=o||{};
  series=series.filter(s=>s.pts.length);
  const all=[].concat(...series.map(s=>s.pts));
  if(all.length<2)return '<div class="chart-empty">'+esc(o.empty||'Log at least two entries to draw a trend.')+'</div>';
  const W=340,H=o.h||180,L=36,R=12,T=12,B=24;
  let x0=Math.min(...all.map(p=>p.x)),x1=Math.max(...all.map(p=>p.x));if(x1===x0){x0-=DAY;x1+=DAY;}
  const ys=all.map(p=>p.y);let y0=Math.min(...ys),y1=Math.max(...ys);
  if(y1===y0){y0-=Math.abs(y0)*.05||1;y1+=Math.abs(y1)*.05||1;}
  const st=niceStep(y1-y0);y0=Math.floor(y0/st)*st;y1=Math.ceil(y1/st)*st;
  if(o.zero&&y0<0&&Math.min(...ys)>=0)y0=0;
  const X=x=>L+(x-x0)/(x1-x0)*(W-L-R),Y=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
  let g='';
  for(let v=y0;v<=y1+st/2;v+=st){const y=Y(v).toFixed(1);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)" stroke-width="1"/><text x="'+(L-6)+'" y="'+(+y+3.5)+'" text-anchor="end">'+fmt(v,1)+(o.unit||'')+'</text>';}
  g+='<text x="'+L+'" y="'+(H-6)+'">'+fmtDate(x0)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+fmtDate(x1)+'</text>';
  series.forEach((s,i)=>{
    const pts=s.pts.slice().sort((a,b)=>a.x-b.x),col=s.color||PAL[i%PAL.length];
    const d=pts.map((p,j)=>(j?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');
    if(series.length===1&&pts.length>1)g+='<path d="'+d+' L'+X(pts[pts.length-1].x).toFixed(1)+' '+(H-B)+' L'+X(pts[0].x).toFixed(1)+' '+(H-B)+'Z" fill="'+col+'" fill-opacity=".1"/>';
    g+='<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"'+(s.dash?' stroke-dasharray="5 4"':'')+'/>';
    if(pts.length<=40&&!s.dash)pts.forEach(p=>{g+='<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="3" fill="var(--surface)" stroke="'+col+'" stroke-width="2"/>';});
    if(!s.dash){const lp=pts[pts.length-1];g+='<text class="vlab" x="'+Math.min(X(lp.x),W-R).toFixed(1)+'" y="'+(Y(lp.y)-8).toFixed(1)+'" text-anchor="end">'+fmt(lp.y,1)+(o.unit||'')+'</text>';}
  });
  const leg=series.length>1?'<div class="legend">'+series.map((s,i)=>'<span><i style="background:'+(s.color||PAL[i%PAL.length])+'"></i>'+esc(s.name)+'</span>').join('')+'</div>':'';
  return '<figure class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'Chart')+'">'+g+'</svg>'+leg+'</figure>';
}
function barChart(items,o){
  o=o||{};
  if(!items.length||items.every(i=>!i.v)&&o.hideEmpty)return '<div class="chart-empty">'+esc(o.empty||'Nothing logged yet.')+'</div>';
  const W=340,H=o.h||160,L=6,R=6,T=16,B=22;const max=Math.max(o.goal||0,...items.map(i=>i.v),1);
  const bw=(W-L-R)/items.length;let g='';
  const Y=v=>T+(1-v/max)*(H-T-B);
  items.forEach((it,i)=>{const x=L+i*bw+bw*.18,w=bw*.64,y=Y(it.v),h=(H-B)-y;
    g+='<rect x="'+x.toFixed(1)+'" y="'+(it.v?y:H-B-2).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+(it.v?Math.max(h,2):2).toFixed(1)+'" rx="3" fill="'+(it.v?(o.goal&&it.v>=o.goal?'var(--green)':(o.color||'var(--green)')):'var(--surface2)')+'"'+(o.goal&&it.v&&it.v<o.goal?' fill-opacity=".45"':'')+'/>';
    if(it.v)g+='<text class="vlab" x="'+(x+w/2).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle">'+(o.fmt?o.fmt(it.v):it.v)+'</text>';
    if(it.label&&(items.length<=7||i%3===(items.length-1)%3))g+='<text x="'+(x+w/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+esc(it.label)+'</text>';
  });
  if(o.goal){const y=Y(o.goal).toFixed(1);g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--muted)" stroke-dasharray="3 4"/>';}
  return '<figure class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.label||'Bar chart')+'">'+g+'</svg></figure>';
}
function heatmap(weeks){
  const counts={};S.workouts.forEach(w=>{const k=dayStart(w.start);counts[k]=(counts[k]||0)+1;});
  S.cardio.forEach(c=>{const k=dayStart(c.date);counts[k]=(counts[k]||0)+.5;});
  const cs=13,gap=3,top=14,left=16;const start=weekStart(Date.now())-(weeks-1)*7*DAY;
  let g='',lastM=-1;
  ['M','','W','','F','','S'].forEach((l,i)=>{if(l)g+='<text x="0" y="'+(top+i*(cs+gap)+10)+'">'+l+'</text>';});
  for(let c=0;c<weeks;c++){
    const ws=start+c*7*DAY;const m=new Date(ws+3*DAY).getMonth();
    if(m!==lastM){g+='<text x="'+(left+c*(cs+gap))+'" y="9">'+new Date(ws+3*DAY).toLocaleDateString('en-GB',{month:'short'})+'</text>';lastM=m;}
    for(let r=0;r<7;r++){
      const day=dayStart(ws+r*DAY+2*3600e3);if(day>Date.now())continue;
      const v=counts[day]||0;
      const fill=v>=1?'var(--green)':v>0?'var(--green-soft)':'var(--surface2)';
      g+='<rect x="'+(left+c*(cs+gap))+'" y="'+(top+r*(cs+gap))+'" width="'+cs+'" height="'+cs+'" rx="3" fill="'+fill+'"><title>'+fmtDate(day)+(v?': trained':'')+'</title></rect>';
    }
  }
  const W=left+weeks*(cs+gap),H=top+7*(cs+gap);
  return '<figure class="chart"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Training days, last '+weeks+' weeks">'+g+'</svg><div class="legend"><span><i style="background:var(--green);height:10px;width:10px;border-radius:3px"></i>Strength workout</span><span><i style="background:var(--green-soft);height:10px;width:10px;border-radius:3px"></i>Cardio only</span></div></figure>';
}

  if(!storageOK)h+='<div class="notice">This browser is blocking storage, so nothing will be kept after you close the app. Export a backup from Settings after each session.</div>';

    const names=p.items.map(id=>ex(id)).filter(Boolean).map(e=>e.name);
    h+='<section class="hero"><div class="kicker">Next scheduled workout</div><h2>'+esc(p.name)+'</h2><div class="ex-line">'+(names.length?esc(names.join(', ')):'No exercises yet')+'</div><button class="btn primary big" data-act="start" data-id="'+p.id+'">'+I.play+' Start '+esc(p.name)+'</button><div style="display:flex;justify-content:center;margin-top:8px"><button class="link" data-act="go" data-to="train">Choose another program</button></div></section>';
  } else h+='<section class="hero"><div class="kicker">No programs yet</div><h2>Ready when you are</h2><button class="btn primary big" data-act="start-empty">'+I.play+' Start empty workout</button></section>';
  const metric=(lab,m,unit,goodDown)=>{
    if(!m)return '<div class="stat"><div class="lab">'+lab+'</div><div class="val faint">–</div><div class="delta"><button class="link" style="padding:0" data-act="body-new">Add entry</button></div></div>';
    let d='';if(m.prev!=null){const diff=m.v-m.prev;const cls=goodDown&&diff<0?'good':goodDown&&diff>0?'bad':'';d='<div class="delta '+cls+'">'+signed(diff,unit,1)+' since '+fmtDate(m.prevDate)+'</div>';}
    else d='<div class="delta">'+fmtDay(m.date)+'</div>';
    return '<div class="stat"><div class="lab">'+lab+'</div><div class="val">'+fmt(m.v,1)+'<small>'+unit+'</small></div>'+d+'</div>';
  };
  h+='<section class="stats" aria-label="Summary">'+metric('Body weight',bw,'kg',false)+metric('Body fat',bf,'%',true)+
    '<div class="stat"><div class="lab">This week</div><div class="val">'+wkN+'<small>/ '+goal+'</small></div><div class="bar" aria-label="'+Math.min(100,Math.round(wkN/goal*100))+'% of weekly goal"><i style="width:'+Math.min(100,wkN/goal*100)+'%"></i></div><div class="delta">'+Math.min(100,Math.round(wkN/goal*100))+'% of weekly goal</div></div>'+
    '<div class="stat"><div class="lab">Week streak</div><div class="val">'+streak+'<small>'+(streak===1?'week':'weeks')+'</small></div><div class="delta">Weeks with '+goal+'+ workouts</div></div></section>';
  if(hasData())h+='<div class="backup-line'+(backupDue()?' due':'')+'"><span>'+backupAgo()+'</span><button class="link" data-act="backup-now">Back up now</button></div>';
  h+='<h2 class="st">Last workout</h2>';
  if(lw){const sets=lw.exercises.reduce((a,e)=>a+e.sets.length,0);
    h+='<div class="card"><button class="row" data-act="w-detail" data-id="'+lw.id+'"><div class="grow"><div class="t">'+esc(lw.name)+'</div><div class="s">'+fmtDay(lw.start)+', '+fmtDur(lw.end-lw.start)+', '+lw.exercises.length+' exercises, '+sets+' sets</div></div><div class="r"><div class="big">'+fmtInt(lw.exercises.reduce((a,e)=>a+vol(e.sets),0))+'</div><div class="s">kg volume</div></div></button></div>';
  } else h+='<div class="empty">Your first finished workout shows up here.</div>';
  h+='<h2 class="st">Recent strength improvements</h2>';
  if(imps.length)h+='<div class="card">'+imps.map(i=>'<button class="row" data-act="ex-progress" data-id="'+i.e.id+'"><div class="grow"><div class="t">'+esc(i.e.name)+'</div><div class="s">'+fmtDay(i.when)+': '+esc(i.now)+'</div></div><span class="chip up">'+I.arrowUp+esc(i.d)+'</span></button>').join('')+'</div>';
  else h+='<div class="empty">Repeat an exercise in two workouts and any gains in weight or reps appear here.</div>';
  return h;
}
function liveHero(){
  const a=S.active,done=a.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0),tot=a.exercises.reduce((n,e)=>n+e.sets.length,0);

}
function vTrain(){

function cardioRow(c){

}

  h+='<button class="btn danger quiet" data-act="discard" style="margin-top:6px">Discard workout</button>';
  return h;

function placeholderFor(we,j,prev,e){
  const cur=we.sets.slice(0,j).filter(s=>s.done).pop();
  const pLast=prev[prev.length-1];
  let w=cur?cur.w:(we.targetW!=null?we.targetW:(prev[j]?prev[j].w:(pLast?pLast.w:'')));
  let r;
  if(we.targetW!=null&&!cur&&prev.length&&we.targetW>topW(prev))r=e.repMin;
  else r=prev[j]?prev[j].r:(cur?cur.r:(e.repMin||''));
  return {w:w===''||w==null?'':fmt(+w),r:r===''||r==null?'':String(r)};
}
function exCard(i){
  const we=S.active.exercises[i],e=ex(we.exId)||{id:we.exId,name:we.name,sets:3,repMin:8,repMax:12,equipment:'Other'};
  const hist=sessionsFor(we.exId),prev=hist[0]?hist[0].sets:[];
  const rec=recommend(e,hist);
  const done=we.sets.filter(s=>s.done);
  const st=done.length&&prev.length?compare(done,prev.slice(0,done.length)):(done.length&&!prev.length?'new':null);
  let h='<article class="exc" id="exc-'+i+'"><header class="exc-head"><div class="grow"><h3>'+esc(e.name)+'</h3><div class="meta">Target '+e.sets+' × '+e.repMin+'–'+e.repMax+', rest '+fmtRest(we.rest)+'</div></div>'+chip(st)+'<button class="icon-btn sm" data-act="ex-menu" data-i="'+i+'" aria-label="Options for '+esc(e.name)+'">'+I.more+'</button></header>';
  if(prev.length){
    const pe=hist[0].e;
    h+='<div class="prevbox">Last time, '+fmtDay(hist[0].w.start)+': <b>'+esc(setsStr(prev))+'</b>, '+fmtInt(vol(prev))+' kg volume'+(pe.notes?'<br>Note: '+esc(pe.notes):'')+'</div>';
  } else h+='<div class="prevbox">No history yet for this exercise.</div>';
  if(rec){
    let btn='';
    if((rec.kind==='increase'||rec.kind==='deload')&&rec.to!=null){
      btn=we.targetW!=null&&eq(we.targetW,rec.to)?'<span class="chip up">'+I.check+' Using '+fmt(rec.to)+' kg</span>':'<button class="btn '+(rec.kind==='increase'?'primary':'')+' sm" data-act="apply-w" data-i="'+i+'" data-w="'+rec.to+'">Use '+fmt(rec.to)+' kg</button>';
    }
    h+='<div class="rec rec-'+rec.kind+'"><div>'+esc(rec.text)+'</div>'+btn+'</div>';
  }
  h+='<div class="sets"><div class="set head" aria-hidden="true"><span>Set</span><span>Previous</span><span>kg</span><span>Reps</span><span></span></div>';
  we.sets.forEach((s,j)=>{
    const p=prev[j],ph=placeholderFor(we,j,prev,e);
    const sc=s.done&&p?compareSet(s,p):null;
    h+='<div class="set'+(s.done?' done':'')+'" data-i="'+i+'" data-j="'+j+'"><div class="set-n '+(sc&&sc!=='same'?sc:'')+'" title="'+(sc==='up'?'Better than last time':sc==='down'?'Below last time':'')+'">'+(j+1)+'</div><div class="set-prev">'+(p?((+p.w||0)>0?fmt(+p.w)+'×'+p.r:p.r+' reps'):'–')+'</div>'+
      '<input class="num" inputmode="decimal" enterkeyhint="next" autocomplete="off" data-f="w" value="'+esc(s.w)+'" placeholder="'+esc(ph.w)+'" aria-label="Set '+(j+1)+' weight in kilograms">'+
      '<input class="num" inputmode="numeric" pattern="[0-9]*" enterkeyhint="done" autocomplete="off" data-f="r" value="'+esc(s.r)+'" placeholder="'+esc(ph.r)+'" aria-label="Set '+(j+1)+' reps">'+
      '<button class="check" data-act="set-done" aria-pressed="'+!!s.done+'" aria-label="'+(s.done?'Undo':'Complete')+' set '+(j+1)+'">'+I.check+'</button></div>';
  });
  h+='</div><div class="exc-actions"><button class="btn" data-act="set-add" data-i="'+i+'">'+I.plus+' Set</button><button class="btn" data-act="set-rm" data-i="'+i+'"'+(we.sets.length<=1?' disabled':'')+'>'+I.minus+' Set</button><button class="btn" data-act="rest-start" data-i="'+i+'">'+I.timer+' Rest</button></div>';
  h+='<textarea class="note" data-f="note" data-i="'+i+'" rows="1" placeholder="Exercise notes, e.g. seat height 4">'+esc(we.notes||'')+'</textarea></article>';
  return h;
}

function progHistory(){
  const items=S.workouts.map(w=>({t:w.start,w:w})).concat(S.cardio.map(c=>({t:c.date,c:c}))).sort((a,b)=>b.t-a.t);
  if(!items.length)return '<div class="empty">Finished workouts and cardio sessions are listed here, newest first.</div>';
  let h='',lastMonth='';
  items.forEach(it=>{
    const m=new Date(it.t).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
    if(m!==lastMonth){if(lastMonth)h+='</div>';h+='<h2 class="st" style="margin-top:'+(lastMonth?'24px':'4px')+'">'+m+'</h2><div class="card">';lastMonth=m;}

function progTrends(){

  h+='<div class="panel"><h3>Consistency</h3><div class="s">Training days, last 20 weeks</div>'+heatmap(20)+'</div>';
  const months=[];for(let k=5;k>=0;k--){const d=new Date();d.setDate(1);d.setHours(0,0,0,0);d.setMonth(d.getMonth()-k);const s=d.getTime();const e=new Date(d.getFullYear(),d.getMonth()+1,1).getTime();
    const days=new Set(S.workouts.filter(w=>w.start>=s&&w.start<e).map(w=>dayStart(w.start)));months.push({label:d.toLocaleDateString('en-GB',{month:'short'}),v:days.size});}
  h+='<div class="panel"><h3>Monthly consistency</h3><div class="s">Days with a strength workout per month</div>'+barChart(months,{label:'Monthly training days'})+'</div>';
  // strength progression across most-logged lifts
  const ids=exercisesWithHistory().map(id=>({id:id,h:sessionsFor(id)})).filter(o=>o.h.length>=2&&e1rm(o.h[o.h.length-1].sets)>0).sort((a,b)=>b.h.length-a.h.length).slice(0,4);
  h+='<div class="panel"><h3>Strength progression</h3><div class="s">Change in estimated 1RM since your first session, top lifts</div>'+
    lineChart(ids.map(o=>{const asc=o.h.slice().reverse(),b=e1rm(asc[0].sets);return {name:exName(o.id),pts:asc.map(s=>({x:s.w.start,y:r2((e1rm(s.sets)/b-1)*100)}))};}),{unit:'%',label:'Strength progression',empty:'Log the same weighted exercise in two workouts to see strength trends.'})+'</div>';
  const ws=S.workouts.slice(0,30).reverse();
  h+='<div class="panel"><h3>Volume per workout</h3><div class="s">Last 30 workouts, kg</div>'+lineChart([{name:'Volume',pts:ws.map(w=>({x:w.start,y:Math.round(w.exercises.reduce((a,e)=>a+vol(e.sets),0))}))}],{zero:true,label:'Volume per workout'})+'</div>';
  return h;
}

function filterEx(q,cat,opt){
  opt=opt||{};q=(q||'').trim().toLowerCase();
  return S.exercises.filter(e=>{
    if(cat==='Archived'){if(!e.archived)return false;}else if(e.archived)return false;
    if(opt.noCardio&&isCardio(e))return false;
    if(cat==='Custom'&&!e.custom)return false;
    if(MUSCLES.includes(cat)&&e.muscle!==cat)return false;
    if(q&&!(e.name+' '+e.muscle+' '+e.equipment).toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>MUSCLES.indexOf(a.muscle)-MUSCLES.indexOf(b.muscle)||a.name.localeCompare(b.name));
}
function libList(){
  const list=filterEx(UI.libQ,UI.libCat);

  });

}

const T={total:0,left:0,end:0,running:false,label:'',visible:false,finished:false};
let audioCtx=null;
function unlockAudio(){try{if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(C)audioCtx=new C();}if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();}catch(e){}}
function beep(){try{if(!audioCtx)return;[0,0.28,0.56].forEach(t=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);const s=audioCtx.currentTime+t;g.gain.setValueAtTime(0.0001,s);g.gain.exponentialRampToValueAtTime(0.3,s+0.02);g.gain.exponentialRampToValueAtTime(0.0001,s+0.22);o.start(s);o.stop(s+0.24);});}catch(e){}}
function startRest(sec,label){T.total=Math.max(5,sec|0);T.left=T.total;T.end=Date.now()+T.total*1000;T.running=true;T.label=label||'Rest';T.visible=true;T.finished=false;renderTimer();}
function renderTimer(){
  const el=$('#timer');
  if(!T.visible){el.classList.remove('show');$('#app').classList.remove('timer-on');return;}
  el.classList.add('show');$('#app').classList.add('timer-on');el.classList.toggle('finished',T.finished);
  el.innerHTML='<div class="timer-in"><div class="timer-bar" id="tbar" style="width:'+(T.total?(1-T.left/T.total)*100:0)+'%"></div><div class="timer-main"><div class="timer-time" id="ttime">'+(T.finished?'Go':fmtClock(T.left))+'</div><div class="timer-lab">'+esc(T.finished?'Rest done, next set':T.label)+'</div></div>'+
   '<button class="icon-btn adj" data-act="t-adj" data-d="-15" aria-label="Remove 15 seconds">−15</button>'+
   '<button class="icon-btn adj" data-act="t-adj" data-d="15" aria-label="Add 15 seconds">+15</button>'+
   '<button class="icon-btn" data-act="t-toggle" aria-label="'+(T.running?'Pause':'Start')+' timer">'+(T.running?I.pause:I.play)+'</button>'+
   '<button class="icon-btn" data-act="t-reset" aria-label="Reset timer">'+I.reset+'</button>'+
   '<button class="icon-btn" data-act="t-close" aria-label="Close timer">'+I.x+'</button></div>';
}
setInterval(()=>{
  if(T.running){T.left=Math.max(0,(T.end-Date.now())/1000);
    const tt=$('#ttime'),tb=$('#tbar');if(tt)tt.textContent=fmtClock(T.left);if(tb)tb.style.width=(1-T.left/T.total)*100+'%';

async function deleteExercise(id){
  const e=ex(id);
  const hasHist=S.workouts.some(w=>w.exercises.some(x=>x.exId===id))||S.cardio.some(c=>c.type===id);
  const inActive=S.active&&S.active.exercises.some(x=>x.exId===id);
  const progs=S.programs.filter(p=>p.items.includes(id));
  if(inActive){toast('Remove it from the current workout first');return;}
  if(hasHist){
    if(!await confirmSheet(e.name+' has logged history. It will be archived: hidden from the library and removed from '+(progs.length?progs.length+' program'+(progs.length>1?'s':''):'programs')+', while every past set stays in your history and charts. You can restore it from the Archived filter.','Archive exercise',true,'Keep the history?'))return exDetail(id);
    e.archived=true;
  } else {
    if(!await confirmSheet('Delete '+e.name+(progs.length?' and remove it from '+progs.length+' program'+(progs.length>1?'s':''):'')+'? It has no logged history.','Delete exercise',true))return exDetail(id);
    S.exercises=S.exercises.filter(x=>x.id!==id);
  }
  S.programs.forEach(p=>{p.items=p.items.filter(x=>x!==id);});
  save();render();toast(hasHist?'Archived, history kept':'Deleted');
}

    '<div class="g2">'+field('Weekly goal (workouts)','<input class="input" id="st-goal" inputmode="numeric" value="'+S.settings.weeklyGoal+'">')+field('Default rest (seconds)','<input class="input" id="st-rest" inputmode="numeric" value="'+S.settings.defaultRest+'">')+'</div>'+
    '<div class="field"><span>Weight step by equipment (kg), used for increase suggestions</span><div class="g3">'+['Machine','Cable','Dumbbell','Barbell','Smith machine','Kettlebell'].map(k=>'<label class="field" style="margin:0"><span style="font-size:13px">'+k+'</span><input class="input" inputmode="decimal" data-inc="'+k+'" value="'+S.settings.inc[k]+'"></label>').join('')+'</div></div>'+
    field('Backup reminder after a workout','<select class="select" id="st-bk">'+[[0,'Off'],[3,'Every 3 days'],[7,'Every 7 days'],[14,'Every 14 days']].map(o=>'<option value="'+o[0]+'"'+((+S.settings.backupDays||0)===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>')+
    field('Appearance','<select class="select" id="st-theme">'+[['dark','Dark'],['light','Light']].map(t=>'<option value="'+t[0]+'"'+(S.settings.theme===t[0]?' selected':'')+'>'+t[1]+'</option>').join('')+'</select>')+
    '<button class="btn primary" data-act="st-save">Save settings</button>'+
    '<h2 class="st">Your data</h2><p class="lead">Everything is stored on this device only, in this browser. Nothing is uploaded. '+backupAgo()+'. '+n.w+' workouts, '+n.s+' sets, '+n.b+' body entries, '+n.c+' cardio sessions, '+n.x+' custom exercises.</p>'+
    (storageOK?'':'<div class="notice">Storage is blocked in this browser, so data is lost when you close the app.</div>')+
    '<div class="stack"><button class="btn" data-act="st-export">Export full backup (JSON)</button><button class="btn" data-act="st-csv">Export sets as spreadsheet (CSV)</button><button class="btn" data-act="st-import">Import a backup</button><button class="btn danger quiet" data-act="st-wipe">Erase all data</button></div>'+
    '<p class="small faint" style="margin-top:16px">Tip: export a backup every week or two and keep it in your files or iCloud Drive.</p>',{
    'st-save':()=>{
      const g=Math.round(num($('#st-goal').value)||0),r=Math.round(num($('#st-rest').value)||0);
      if(g<1||g>14){toast('Weekly goal must be 1 to 14');return;}if(r<5){toast('Rest must be at least 5 seconds');return;}
      let bad=false;document.querySelectorAll('[data-inc]').forEach(i=>{const v=num(i.value);if(v==null||v<0)bad=true;else S.settings.inc[i.dataset.inc]=v;});
      if(bad){toast('Weight steps must be numbers');return;}
      S.settings.weeklyGoal=g;S.settings.defaultRest=r;S.settings.theme=$('#st-theme').value;S.settings.backupDays=+$('#st-bk').value;applyTheme();save();closeSheet();render();toast('Settings saved');},
    'st-export':async()=>{if(await backupNow())settingsSheet();},
    'st-csv':()=>{
      const rows=[['date','workout','exercise','muscle','set','weight_kg','reps','volume_kg','exercise_notes']];
      S.workouts.slice().reverse().forEach(w=>w.exercises.forEach(e=>e.sets.forEach((s,j)=>{const x=ex(e.exId);rows.push([isoOf(w.start),w.name,exName(e.exId,e.name),x?x.muscle:'',j+1,s.w,s.r,r2((+s.w||0)*(+s.r||0)),j===0?e.notes||'':'']);})));
      saveFile('gymforge-sets-'+isoOf(Date.now())+'.csv',rows.map(r=>r.map(c=>{c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(',')).join('\n'),'text/csv');},
    'st-import':()=>{const f=$('#importFile');f.value='';f.click();},
    'st-wipe':async()=>{
      if(!await confirmSheet('This erases every workout, measurement and custom exercise on this device. Export a backup first if you might want it back.','Continue',true,'Erase all data?'))return settingsSheet();
      if(!await confirmSheet('Last check. Erase everything now?','Erase everything',true))return settingsSheet();
      try{localStorage.setItem(KEY+'.beforeErase',JSON.stringify(S));}catch(e){}
      S=defaults();save();render();toast('All data erased');}
  });
}
async function saveFile(name,text,mime){
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      const dl=await window.claude.use('downloads');
      if(dl){try{await dl.save({filename:name,data:text});toast('Saved '+name);return true;}catch(e){if(e&&e.code!=='declined')toast('Could not save the file here');return false;}}
    }
  }catch(e){}
  try{
    const file=new File([text],name,{type:mime});
    if(navigator.canShare&&navigator.canShare({files:[file]})&&/iPhone|iPad|Android/i.test(navigator.userAgent)){await navigator.share({files:[file],title:name});toast('Saved '+name);return true;}
  }catch(e){if(e&&e.name==='AbortError')return false;}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1500);toast('Exported '+name);return true;
}
async function backupNow(){
  const ok=await saveFile('gymforge-backup-'+isoOf(Date.now())+'.json',JSON.stringify(Object.assign({app:'GymForge',exportedAt:new Date().toISOString()},S),null,1),'application/json');
  if(ok){S.settings.lastBackup=Date.now();save();if(!$('#sheet').classList.contains('open'))render();}
  return ok;
}
function hasData(){return S.workouts.length||S.body.length||S.cardio.length;}
function backupDue(){const d=+S.settings.backupDays||0;if(!d||!hasData())return false;const lb=S.settings.lastBackup;return !lb||Date.now()-lb>=d*DAY;}
function backupAgo(){const lb=S.settings.lastBackup;if(!lb)return 'Not backed up yet';const days=Math.round((dayStart(Date.now())-dayStart(lb))/DAY);return 'Last backup '+(days===0?'today':days===1?'yesterday':days+' days ago');}
$('#importFile').addEventListener('change',ev=>{
  const f=ev.target.files&&ev.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=async()=>{
    let d;try{d=JSON.parse(rd.result);}catch(e){toast('That file is not a GymForge backup');return;}
    if(!d||!Array.isArray(d.workouts)||!Array.isArray(d.exercises)||!Array.isArray(d.programs)){toast('That file is not a GymForge backup');return;}
    const inc=migrate(clone(d));delete inc.app;delete inc.exportedAt;
    openSheet('<h2>Import backup</h2><p class="lead">The file holds '+inc.workouts.length+' workouts, '+inc.body.length+' body entries and '+inc.cardio.length+' cardio sessions.</p><div class="stack"><button class="btn primary" data-act="im-merge">Merge with my data</button><button class="btn danger" data-act="im-replace">Replace all my data</button><button class="btn quiet" data-act="sheet-close">Cancel</button></div><p class="small muted" style="margin-top:12px">Merge keeps everything on this device and adds anything new from the file. Replace keeps a safety copy of your current data on this device first.</p>',{
      'im-merge':()=>{
        const add=(k)=>{const have=new Set(S[k].map(x=>x.id));inc[k].forEach(x=>{if(x&&x.id&&!have.has(x.id))S[k].push(x);});};
        ['exercises','programs','workouts','body','cardio'].forEach(add);
        S.workouts.sort((a,b)=>b.start-a.start);save();closeSheet();render();toast('Backup merged');},
      'im-replace':async()=>{if(!await confirmSheet('Replace everything on this device with the backup?','Replace data',true))return;
        try{localStorage.setItem(KEY+'.beforeImport',JSON.stringify(S));}catch(e){}
        S=inc;S.active=S.active||null;applyTheme();save();render();toast('Backup restored');}
    });
  };
  rd.readAsText(f);
});
function applyTheme(){document.documentElement.setAttribute('data-theme',S.settings.theme==='light'?'light':'dark');const m=document.querySelector('meta[name=theme-color]');if(m)m.content=S.settings.theme==='light'?'#F2F3F5':'#000000';}

/* ---------- events ---------- */
document.addEventListener('click',async ev=>{
  unlockAudio();
  const el=ev.target.closest('[data-act]');if(!el||el.disabled)return;
  const act=el.dataset.act;
  if($('#sheet').contains(el)){
    if(sheetH[act]){ev.preventDefault();sheetH[act](el);return;}
    if(act==='sheet-close'){closeSheet();return;}
  }
  const i=el.dataset.i!=null?+el.dataset.i:(el.closest('.set')?+el.closest('.set').dataset.i:null);
  switch(act){
    case 'go':go(el.dataset.to);break;
    case 'settings':settingsSheet();break;
    case 'backup-now':backupNow();break;
    case 'start':startWorkout(el.dataset.id);break;
    case 'start-empty':startWorkout(null);break;
    case 'finish':finishWorkout();break;
    case 'discard':if(await confirmSheet('Discard this workout? Ticked sets will not be saved.','Discard workout',true))discardActive();break;
    case 'w-add-ex':addExToWorkout();break;
    case 'ex-menu':exMenu(i);break;
    case 'set-done':{
      const row=el.closest('.set'),j=+row.dataset.j,we=S.active.exercises[i],s=we.sets[j];
      if(s.done){s.done=false;save();refreshCard(i);break;}
      const wi=row.querySelector('[data-f=w]'),ri=row.querySelector('[data-f=r]');
      let w=num(wi.value);if(w==null)w=num(wi.placeholder);if(w==null)w=0;
      let r=num(ri.value);if(r==null)r=num(ri.placeholder);
      if(r==null||r<=0){toast('Enter reps for this set');ri.focus();break;}
      if(w<0){toast('Weight cannot be negative');break;}
      s.w=w;s.r=Math.round(r);s.done=true;s.t=Date.now();
      save();refreshCard(i);
      const e=ex(we.exId);
      const moreLeft=we.sets.some(x=>!x.done)||S.active.exercises.slice(i+1).some(x=>x.sets.some(y=>!y.done));
      if(moreLeft)startRest(we.rest,(e?e.name:we.name)+', set '+(j+1)+' done');
      break;}
    case 'set-add':{const we=S.active.exercises[i];we.sets.push({w:'',r:'',done:false});save();refreshCard(i);break;}
    case 'set-rm':{const we=S.active.exercises[i];if(we.sets.length<=1)break;const last=we.sets[we.sets.length-1];
      if(last.done&&!await confirmSheet('The last set is ticked off. Remove it anyway?','Remove set',true))break;we.sets.pop();save();refreshCard(i);break;}
    case 'rest-start':{const we=S.active.exercises[i];startRest(we.rest,exName(we.exId,we.name));break;}
    case 'apply-w':{const we=S.active.exercises[i];we.targetW=+el.dataset.w;we.sets.forEach(s=>{if(!s.done)s.w='';});save();refreshCard(i);toast('Remaining sets set to '+fmt(we.targetW)+' kg');break;}
    case 't-toggle':if(T.running){T.left=Math.max(0,(T.end-Date.now())/1000);T.running=false;}else{if(T.left<=0)T.left=T.total;T.end=Date.now()+T.left*1000;T.running=true;T.finished=false;}renderTimer();break;
    case 't-reset':T.running=false;T.finished=false;T.left=T.total;renderTimer();break;
    case 't-adj':{const dd=+el.dataset.d;T.total=Math.max(5,T.total+dd);if(T.running){T.end=Math.max(Date.now(),T.end+dd*1000);T.left=(T.end-Date.now())/1000;}else T.left=Math.max(0,Math.min(T.total,T.left+dd));T.finished=false;renderTimer();break;}
    case 't-close':T.visible=false;T.running=false;renderTimer();break;
    case 'prog-new':progEditor(null);break;
    case 'prog-edit':progEditor(el.dataset.id);break;
    case 'cardio-new':cardioEditor(null);break;
    case 'cardio-edit':cardioEditor(el.dataset.id);break;
    case 'w-detail':workoutDetail(el.dataset.id);break;
    case 'ptab':UI.ptab=el.dataset.t;render();break;
    case 'ex-progress':UI.ptab='exercise';UI.pex=el.dataset.id;go('progress');break;
    case 'ex-detail':exDetail(el.dataset.id);break;
    case 'ex-new':exEditor(null);break;
    case 'libcat':UI.libCat=el.dataset.c;render();break;
    case 'bmetric':UI.bmetric=el.dataset.k;render();break;
    case 'body-new':bodyEditor(null);break;
    case 'body-edit':bodyEditor(el.dataset.id);break;
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if($('#sheet').contains(t)){const h=sheetH['input:'+t.id];if(h)h(t);return;}
  const f=t.dataset&&t.dataset.f;if(!f)return;
  if((f==='w'||f==='r')&&S.active){const row=t.closest('.set');const s=S.active.exercises[+row.dataset.i].sets[+row.dataset.j];s[f]=t.value;save();}
  else if(f==='note'&&S.active){S.active.exercises[+t.dataset.i].notes=t.value;save();}
  else if(f==='wnote'&&S.active){S.active.notes=t.value;save();}
  else if(f==='libq'){UI.libQ=t.value;$('#liblist').innerHTML=libList();}
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if($('#sheet').contains(t)){const h=sheetH['change:'+t.id];if(h)h(t);return;}
  if(t.dataset&&t.dataset.f==='pex'){UI.pex=t.value;render();}
});
document.addEventListener('keydown',ev=>{
  if(ev.key==='Escape'&&$('#sheet').classList.contains('open')){if(sheetH['sheet-close'])sheetH['sheet-close']();else closeSheet();}
  if(ev.key==='Enter'&&ev.target.classList&&ev.target.classList.contains('num')&&ev.target.closest('#wex')){
    ev.preventDefault();const all=[...document.querySelectorAll('#wex .set:not(.done) .num')];const k=all.indexOf(ev.target);
    if(ev.target.dataset.f==='r'){ev.target.blur();}else if(all[k+1])all[k+1].focus();
  }
});
window.addEventListener('hashchange',fromHash);
window.addEventListener('storage',ev=>{if(ev.key===KEY&&ev.newValue){try{S=migrate(JSON.parse(ev.newValue));render();}catch(e){}}});

/* ---------- boot ---------- */
applyTheme();
if(!S.active&&location.hash==='#workout')history.replaceState(null,'','#home');
fromHash();
if(S.active)keepAwake();
// Standalone (self-hosted) install support: manifest, icon and offline cache.
if(!(window.claude&&window.claude.use)){
  const add=(rel,href)=>{const l=document.createElement('link');l.rel=rel;l.href=href;document.head.appendChild(l);};
  add('manifest','manifest.json');add('apple-touch-icon','icon-180.png');
  if('serviceWorker' in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});
}
window.__gf={get S(){return S;},recommend:recommend,compare:compare,sessionsFor:sessionsFor};
})();
</script>
